# Parametros de calibracion del mapa (se instala en /etc/robot_map.conf).
# Todos los valores son PROVISIONALES: hay que medirlos con el robot real.
# Procedimiento de medicion: docs/arquitectura/mapeo.md

# Tamano de la grilla: 80 x 80 celdas de 5 cm = 4 m x 4 m, arranque al centro.
cell_cm=5
grid_w=80
grid_h=80

# Avance y retroceso a plena potencia (cm por segundo).
speed_cm_s=20

# Velocidad angular al girar sobre una rueda (grados por segundo).
turn_rate_deg_s=80

# Distancia del centro del chasis a la rueda que queda quieta al girar
# (la mitad de la separacion entre ruedas), en cm.
pivot_offset_cm=7.5

# Radio del robot (area que limpia en cada pasada), en cm.
robot_radius_cm=10

# Distancia del CENTRO del robot al obstaculo cuando se enciende cada sensor FC-51.
front_obstacle_cm=20
side_obstacle_cm=15

# 1 si TURN_RIGHT gira a la derecha (horario visto desde arriba); -1 si sale invertido.
turn_sign=1
